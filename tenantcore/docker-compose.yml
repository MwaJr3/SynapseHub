name: tenantcore

x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEMO_MODE: ${DEMO_MODE:-true}
  DATABASE_URL: postgresql+psycopg://tenantcore_app:${TENANTCORE_APP_PASSWORD:-tenantcore_app_dev}@postgres:5432/${POSTGRES_DB:-tenantcore}
  MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tenantcore}:${POSTGRES_PASSWORD:-tenantcore_dev}@postgres:5432/${POSTGRES_DB:-tenantcore}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-development-only-change-me-32-bytes}
  CORS_ORIGINS: http://localhost:5309
  RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenantcore}
      POSTGRES_USER: ${POSTGRES_USER:-tenantcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenantcore_dev}
      TENANTCORE_APP_PASSWORD: ${TENANTCORE_APP_PASSWORD:-tenantcore_app_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenantcore} -d ${POSTGRES_DB:-tenantcore}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.demo.seed"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --beat --loglevel=INFO --concurrency=2

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend-dev.Dockerfile
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5309:5309"

volumes:
  postgres-data:
  redis-data:
