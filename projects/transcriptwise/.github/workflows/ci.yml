name: Tests
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: transcriptwise_test
          POSTGRES_USER: transcriptwise
          POSTGRES_PASSWORD: disposable-ci-test-password
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U transcriptwise -d transcriptwise_test" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r backend/requirements-dev.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: .venv/bin/python scripts/test.py --e2e
      - run: ../.venv/bin/python -m pytest -q
        working-directory: backend
        env:
          TW_TEST_DATABASE_URL: postgresql+psycopg://transcriptwise:disposable-ci-test-password@localhost:5432/transcriptwise_test
