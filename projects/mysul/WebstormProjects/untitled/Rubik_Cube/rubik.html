<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubik's Cube Solver</title>
    <link rel="stylesheet" href="rubik.css">
</head>
<body>
<button class="step-button" onclick="nextStep()">Next Solve Step</button>
<div class="scene" id="cube">
    <div class="face front">
        <div class="sticker white"></div>
        <div class="sticker white"></div>
        <div class="sticker white"></div>
        <div class="sticker white"></div>
        <div class="sticker white"></div>
        <div class="sticker white"></div>
        <div class="sticker white"></div>
        <div class="sticker white"></div>
        <div class="sticker white"></div>
    </div>
    <div class="face back">
        <div class="sticker yellow"></div>
        <div class="sticker yellow"></div>
        <div class="sticker yellow"></div>
        <div class="sticker yellow"></div>
        <div class="sticker yellow"></div>
        <div class="sticker yellow"></div>
        <div class="sticker yellow"></div>
        <div class="sticker yellow"></div>
        <div class="sticker yellow"></div>
    </div>
    <div class="face right">
        <div class="sticker green"></div>
        <div class="sticker green"></div>
        <div class="sticker green"></div>
        <div class="sticker green"></div>
        <div class="sticker green"></div>
        <div class="sticker green"></div>
        <div class="sticker green"></div>
        <div class="sticker green"></div>
        <div class="sticker green"></div>
    </div>
    <div class="face left">
        <div class="sticker blue"></div>
        <div class="sticker blue"></div>
        <div class="sticker blue"></div>
        <div class="sticker blue"></div>
        <div class="sticker blue"></div>
        <div class="sticker blue"></div>
        <div class="sticker blue"></div>
        <div class="sticker blue"></div>
        <div class="sticker blue"></div>
    </div>
    <div class="face top">
        <div class="sticker red"></div>
        <div class="sticker red"></div>
        <div class="sticker red"></div>
        <div class="sticker red"></div>
        <div class="sticker red"></div>
        <div class="sticker red"></div>
        <div class="sticker red"></div>
        <div class="sticker red"></div>
        <div class="sticker red"></div>
    </div>
    <div class="face bottom">
        <div class="sticker orange"></div>
        <div class="sticker orange"></div>
        <div class="sticker orange"></div>
        <div class="sticker orange"></div>
        <div class="sticker orange"></div>
        <div class="sticker orange"></div>
        <div class="sticker orange"></div>
        <div class="sticker orange"></div>
        <div class="sticker orange"></div>
    </div>
</div>
<script>
    let step = 0;
    const cube = document.getElementById('cube');
    const steps = [
        'rotateX(0deg) rotateY(0deg)',
        'rotateX(90deg) rotateY(0deg)',
        'rotateX(90deg) rotateY(90deg)',
        'rotateX(180deg) rotateY(90deg)',
        'rotateX(180deg) rotateY(180deg)',
        'rotateX(270deg) rotateY(180deg)',
        'rotateX(360deg) rotateY(360deg)',
    ];

    function nextStep() {
        step = (step + 1) % steps.length;
        cube.style.animation = 'none';
        cube.style.transform = steps[step];
    }
</script>
</body>
</html>
