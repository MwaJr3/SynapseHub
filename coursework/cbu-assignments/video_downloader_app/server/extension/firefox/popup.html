<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VDownloader OS Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 310px;
      padding: 16px;
      background: #0B0F14;
      color: #F8FAFC;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 14px;
    }
    .orb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #C6FF33, #10B981);
      box-shadow: 0 0 10px rgba(198, 255, 51, 0.65);
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(100, 116, 139, 0.22);
      color: #94A3B8;
    }
    .badge.online {
      background: rgba(16, 185, 129, 0.2);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }
    .card {
      background: #131A22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
      color: #CBD5E1;
    }
    .row:last-child { margin-bottom: 0; }
    input[type="number"] {
      width: 82px;
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #0B0F14;
      color: #F8FAFC;
      font-size: 12px;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: none;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(90deg, #C6FF33, #84CC16);
      color: #0B0F14;
    }
    .btn-secondary {
      background: #1E293B;
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 0;
    }
    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #64748B;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="orb"></span>
      <span>VDownloader OS</span>
    </div>
    <span id="statusBadge" class="badge">Checking...</span>
  </div>

  <div class="card">
    <div class="row">
      <label for="wsPort">WebSocket Port</label>
      <input id="wsPort" type="number" min="1024" max="65535" value="8765" />
    </div>
    <div class="row">
      <label for="autoDetect">Auto Mini-Taskbar</label>
      <input id="autoDetect" type="checkbox" checked />
    </div>
    <div class="row">
      <label for="hoverBtn">IDM Video Hover Button</label>
      <input id="hoverBtn" type="checkbox" checked />
    </div>
  </div>

  <button id="sendCurrentBtn" class="btn btn-primary">⬇ Send Active Tab to VDownloader</button>
  <button id="reconnectBtn" class="btn btn-secondary">Reconnect Bridge</button>
  <div id="feedback" class="hint">ws://127.0.0.1:8765</div>

  <script src="popup.js"></script>
</body>
</html>
