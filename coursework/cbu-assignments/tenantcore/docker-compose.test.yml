name: tenantcore-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenantcore_test
      POSTGRES_USER: tenantcore
      POSTGRES_PASSWORD: tenantcore_test_dev
      TENANTCORE_APP_PASSWORD: tenantcore_app_test_dev
    volumes:
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantcore -d tenantcore_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
