name: TenantCore quality

on:
  push:
    paths: ["tenantcore/**", ".github/workflows/tenantcore.yml"]
  pull_request:
    paths: ["tenantcore/**", ".github/workflows/tenantcore.yml"]

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgresql+psycopg://tenantcore_app:tenantcore_app_test_dev@localhost:5433/tenantcore_test
  TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://tenantcore:tenantcore_test_dev@localhost:5433/tenantcore_test
  TEST_REDIS_URL: redis://localhost:6380/0
  JWT_SECRET: ci-only-not-a-production-secret-32-bytes
  DEMO_MODE: "true"
  RATE_LIMIT_FAIL_OPEN: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tenantcore_test
          POSTGRES_USER: tenantcore
          POSTGRES_PASSWORD: tenantcore_test_dev
        ports: ["5433:5432"]
        options: >-
          --health-cmd="pg_isready -U tenantcore -d tenantcore_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: tenantcore/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tenantcore/backend/pyproject.toml
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev]'
      - name: Create unprivileged runtime role
        run: |
          python - <<'PY'
          import os, psycopg
          url = os.environ['TEST_MIGRATION_DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://')
          with psycopg.connect(url, autocommit=True) as db:
              db.execute("CREATE ROLE tenantcore_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'tenantcore_app_test_dev'")
          PY
      - name: Clean migration, API, RLS, and worker tests
        run: RUN_POSTGRES_TESTS=1 TENANTCORE_TEST_ALLOW_RESET=YES pytest -q
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ env.TEST_MIGRATION_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}
      - name: Migration downgrade and re-upgrade
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ env.TEST_MIGRATION_DATABASE_URL }}
      - run: ruff check app migrations tests && ruff format --check app migrations tests
      - run: mypy app
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tenantcore/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tenantcore/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tenantcore_test
          POSTGRES_USER: tenantcore
          POSTGRES_PASSWORD: tenantcore_test_dev
        ports: ["5433:5432"]
        options: >-
          --health-cmd="pg_isready -U tenantcore -d tenantcore_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ env.TEST_MIGRATION_DATABASE_URL }}
      REDIS_URL: ${{ env.TEST_REDIS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tenantcore/backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tenantcore/frontend/package-lock.json
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev]'
        working-directory: tenantcore/backend
      - run: npm ci
        working-directory: tenantcore/frontend
      - name: Create role, migrate, and seed demo
        working-directory: tenantcore/backend
        run: |
          python - <<'PY'
          import os, psycopg
          url = os.environ['MIGRATION_DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://')
          with psycopg.connect(url, autocommit=True) as db:
              db.execute("CREATE ROLE tenantcore_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'tenantcore_app_test_dev'")
          PY
          python -m alembic upgrade head
          python -m app.demo.seed
      - name: Start API
        working-directory: tenantcore/backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://localhost:8000/health/ready', timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('API did not become ready')
          PY
      - run: npx playwright install --with-deps chromium
        working-directory: tenantcore/frontend
      - run: npm run test:e2e
        working-directory: tenantcore/frontend
