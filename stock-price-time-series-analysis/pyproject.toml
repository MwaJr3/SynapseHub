[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-price-time-series-analysis"
version = "2.0.0"
description = "Reproducible comparative financial time-series analytics with Pandas and yfinance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mwangala" }]
dependencies = [
  "matplotlib>=3.8,<4.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "tabulate>=0.9,<1.0",
  "yfinance>=0.2.54,<1.0",
]

[project.optional-dependencies]
notebook = [
  "jupyter>=1.0,<2.0",
  "nbclient>=0.10,<1.0",
  "nbformat>=5.10,<6.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"] # Ruff's formatter intentionally does not wrap long prose strings.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"notebooks/*.ipynb" = ["E402"] # Local src path is established before package imports.
