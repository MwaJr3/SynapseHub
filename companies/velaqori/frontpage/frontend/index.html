<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Frontpage is your personalized front page for tech content: follow RSS and Atom feeds, read in a calm dashboard, and catch up with a daily digest." />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Frontpage — your personalized front page for tech content</title>
    <script>
      try {
        var t = localStorage.getItem('fp-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <meta property="og:title" content="Frontpage — your personalized front page for tech content" />
    <meta property="og:description" content="Frontpage: RSS / Atom Feed Reader. Frontpage" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
