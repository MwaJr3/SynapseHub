name: SynapseHub internal native artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-artifacts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      # Public deployment configuration only, never service-role credentials.
      VITE_SUPABASE_URL: ${{ vars.SYNAPSE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SYNAPSE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_API_ORIGIN: ${{ vars.SYNAPSE_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux WebView prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Require actual deployment configuration
        shell: bash
        run: node scripts/check-native-env.mjs
      - run: npm ci
      - run: npm ci --prefix native/desktop
      - run: npm run build --prefix native/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: synapsehub-desktop-internal-${{ runner.os }}
          path: |
            native/desktop/src-tauri/target/release/bundle/**
            native/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14
  android-debug:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SYNAPSE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SYNAPSE_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_ORIGIN: ${{ vars.SYNAPSE_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          {
            node-version: '22',
            cache: npm,
            cache-dependency-path: native/mobile/package-lock.json,
          }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: node scripts/check-native-env.mjs --mobile
      - run: npm ci
        working-directory: native/mobile
      - run: npm run test:security && npm audit --audit-level=high
        working-directory: native/mobile
      - run: npx expo prebuild --platform android --non-interactive --no-install
        working-directory: native/mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: native/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: synapsehub-android-debug-not-for-store
          path: native/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  ios-simulator:
    runs-on: macos-15
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SYNAPSE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SYNAPSE_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_ORIGIN: ${{ vars.SYNAPSE_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          {
            node-version: '22',
            cache: npm,
            cache-dependency-path: native/mobile/package-lock.json,
          }
      - run: node scripts/check-native-env.mjs --mobile
      - run: npm ci
        working-directory: native/mobile
      - run: npm run test:security && npm audit --audit-level=high
        working-directory: native/mobile
      - run: npx expo prebuild --platform ios --non-interactive --no-install
        working-directory: native/mobile
      - run: npx pod-install
        working-directory: native/mobile
      - run: xcodebuild -workspace ios/SynapseHub.xcworkspace -scheme SynapseHub -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath dist/xcode CODE_SIGNING_ALLOWED=NO
        working-directory: native/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: synapsehub-ios-simulator-not-ipa
          path: native/mobile/dist/xcode/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 14
