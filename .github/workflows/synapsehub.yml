name: SynapseHub connected workspace
on:
  pull_request:
    paths:
      [
        'src/**',
        'packages/synapse-client/**',
        'backend/**',
        'native/**',
        'package*.json',
        '.github/workflows/synapsehub.yml',
      ]
  push:
    paths:
      [
        'src/**',
        'packages/synapse-client/**',
        'backend/**',
        'native/**',
        'package*.json',
        '.github/workflows/synapsehub.yml',
      ]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: node --test scripts/check-native-env.test.mjs
      # Repository-wide lint has unrelated existing violations; do not suppress them.
      - run: npx eslint src/features/synapsehub packages/synapse-client src/App.tsx vite.config.ts
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          {
            python-version: '3.11',
            cache: pip,
            cache-dependency-path: backend/requirements.lock,
          }
      - run: pip install -r backend/requirements.lock
      - run: PYTHONPATH=backend pytest -q backend/tests
  mobile-bundles:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: native/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: '22',
            cache: npm,
            cache-dependency-path: native/mobile/package-lock.json,
          }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm audit --audit-level=high
      - run: npx expo export --platform android --output-dir dist/android
      - run: npx expo export --platform ios --output-dir dist/ios
