name: Playwright browser suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate screenshot baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # On pull requests the default checkout is a detached merge ref, which cannot
      # receive the baseline commit. Check out the PR head SHA so the generated
      # baselines can be pushed back to the pull-request branch fast-forward.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build portfolio
        run: npm run build

      - name: Install and build vocal-separator web app
        run: |
          npm ci --prefix vocal-separator/web
          npm run build --prefix vocal-separator/web

      - name: Run Playwright suite
        id: e2e
        shell: bash
        run: |
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ]; then
            npm run e2e:update -- --retries=0
            touch .snapshots-generated
          elif compgen -G "e2e/*-snapshots/*.png" > /dev/null; then
            npm run e2e
          else
            # First run for a new visual spec: regenerate baselines instead of
            # failing on missing screenshots, then commit them below.
            npm run e2e:update -- --retries=0
            touch .snapshots-generated
          fi

      - name: Commit generated baselines
        if: always() && steps.e2e.outcome == 'success' && hashFiles('.snapshots-generated') != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git commit -m "chore(e2e): add Playwright visual baselines"
          # head_ref is set on pull_request events; fall back to the pushed ref.
          TARGET_BRANCH="${{ github.head_ref }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="${GITHUB_REF##*/}"
          fi
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload screenshot baselines
        if: always() && github.event.inputs.update_snapshots == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: e2e/**/*.png
          if-no-files-found: error

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
