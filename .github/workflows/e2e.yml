name: Playwright browser suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate screenshot baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build portfolio
        run: npm run build

      - name: Install and build vocal-separator web app
        run: |
          npm ci --prefix vocal-separator/web
          npm run build --prefix vocal-separator/web

      - name: Run Playwright suite
        run: |
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ]; then
            npm run e2e:update
          else
            npm run e2e
          fi

      - name: Upload screenshot baselines
        if: github.event.inputs.update_snapshots == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: e2e/**/*.png
          if-no-files-found: error

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
