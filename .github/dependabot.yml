# Dependabot configuration.
#
# Goals: keep the ~120 open alerts from piling up again without flooding the
# repository with one pull request per package per folder.
#   - Security updates for an ecosystem arrive as ONE grouped pull request.
#   - Routine minor/patch version updates are batched into ONE weekly pull
#     request per ecosystem.
#   - Major versions are NOT grouped, so a breaking upgrade is always its own
#     reviewable pull request.
# Manifest folders are listed explicitly (generated from the tree) because a
# glob would also match folders with no manifest and make Dependabot error.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/companies"
      - "/companies/tamuzi/cyberaware-lab/frontend"
      - "/companies/tamuzi/transcriptwise/frontend"
      - "/companies/velaqori/assetwatch/frontend"
      - "/companies/velaqori/hashsight/frontend"
      - "/companies/velaqori/incidentflow/frontend"
      - "/companies/velaqori/netscope/frontend"
      - "/companies/velaqori/phishlens/frontend"
      - "/companies/velaqori/securecode-workbench/frontend"
      - "/companies/velaqori/threatintel-desk/frontend"
      - "/company-platform"
      - "/contextvault"
      - "/coursework/cbu-assignments/tenantcore/frontend"
      - "/native/desktop"
      - "/native/mobile"
      - "/sites/archive/WebstormProjects/Weather App/javascript-main/javascript-main"
      - "/sites/portfolio"
      - "/tools/synapsehub-smoke"
      - "/vocal-separator/web"
      - "/workniche"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Lusaka"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
